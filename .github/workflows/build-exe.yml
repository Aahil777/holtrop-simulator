name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-desktop.txt

      - name: Check engine against the worked example
        run: python -m unittest -v test_holtrop

      - name: Build exe
        run: pyinstaller --noconfirm HoltropMennen.spec

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\HoltropMennenSimulator.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: HoltropMennenSimulator-windows
          path: dist/HoltropMennenSimulator.exe
          if-no-files-found: error
